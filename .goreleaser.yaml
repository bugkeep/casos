# yaml-language-server: $schema=https://goreleaser.com/static/schema.json

version: 2

project_name: casos

builds:
  - env:
      - CGO_ENABLED=0
    flags:
      - -tags=embed
      - -trimpath
    ldflags:
      - -s -w
      - -X main.version={{ .Tag }}
      - -X main.commit={{ .FullCommit }}
      - -X main.date={{ .Date }}
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64

# Release bare executables: the embed build tag compiles web/build into the
# binary, so there is nothing to unpack beside it.
archives:
  - formats: [ binary ]
    # GOARCH spells the 64-bit Intel target "amd64", which reads like an
    # AMD-only build to anyone who does not package software for a living.
    # Publish it under the vendor-neutral "x86_64"; the installers in scripts/
    # ask for the same name.
    name_template: >-
      {{ .ProjectName }}_{{ .Os }}_
      {{- if eq .Arch "amd64" }}x86_64{{ else }}{{ .Arch }}{{ end }}

checksum:
  name_template: SHA256SUMS

# UPX roughly halves a binary that carries a Kubernetes control plane, which is
# the difference between a quick download and a slow one. Windows is left
# uncompressed on purpose: packed executables are a routine antivirus false
# positive, and a blocked download is worse than a large one. macOS is left
# uncompressed because packing rewrites the Mach-O and destroys the ad-hoc
# signature the Go linker emits, which Apple Silicon requires to execute a
# binary at all.
upx:
  - goos: [ linux ]
    goarch: [ amd64, arm64 ]
    enabled: true
    compress: "9"
    lzma: true

release:
  # semantic-release owns the tag, the release and its notes. GoReleaser only
  # attaches artifacts, so it must not rewrite what is already there.
  mode: append

changelog:
  # Release notes come from semantic-release.
  disable: true
